name: Update contribution city
on:
  workflow_dispatch:
  schedule:
    - cron: '22 5 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render SVG from GitHub GraphQL contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_city.py
      - name: Commit SVG when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-city.svg
          if ! git diff --staged --quiet; then
            git commit -m "Update contribution city data"
            git push
          fi
