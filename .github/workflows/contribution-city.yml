name: Update contribution visuals
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_city.py'
      - 'scripts/build_heatmap.py'
      - '.github/workflows/contribution-city.yml'
  schedule:
    - cron: '22 5 * * *'
permissions:
  contents: write
concurrency:
  group: contribution-visuals
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render real contribution city
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_city.py
      - name: Render neon heatmap and animated snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_heatmap.py
      - name: Commit refreshed profile graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-city.svg assets/contribution-heatmap.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): refresh GitHub contribution graphics"
            git push
          fi
